<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Joke Project</title>
</head>

<body
  class="bg-[url(/image/mainBackground.jpg)] bg-no-repeat bg-cover bg-fixed min-h-screen flex items-center justify-center">


  <main>
    <div class="bg-white bg-opacity-80 p-8 rounded-2xl shadow-lg max-w text-center">
      <div class="text-4xl font-bold mb-6 p-8">
        <h1 class="mb-6">Ready to smile?</h1>
        <h3 id="output_joke" class="text-lg mb-6"></h3>
        <div class="flex items-center justify-center gap-4 m-8 bg-red" id="ratingDiv">
          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="happyIcon" data-valor="3"><img class="w-full h-full object-cover pointer-events-none" src="/image/happyIcon.svg"
              alt=""></div>

          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="neutralIcon" data-valor="2"><img class="w-full h-full object-cover pointer-events-none" src="/image/neutralIcon.svg"
              alt=""></div>

          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="angryIcon" data-valor="1"><img class="w-full h-full object-cover pointer-events-none" src="/image/angryIcon.svg"
              alt=""></div>
        </div>
        <button type="submit" id="next_joke"
          class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-800 transition">Next Joke</button>
      </div>

    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
