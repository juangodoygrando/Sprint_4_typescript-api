<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/image/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Joke Project</title>
</head>

<body
  class="bg-[url(/image/mainBackground.jpg)] bg-no-repeat bg-cover bg-fixed min-h-screen flex items-center justify-center">


  <main>

    <div id="weather-widget"
      class="fixed top-5 right-5 w-44 bg-white bg-opacity-80 rounded-2xl shadow-lg p-4 text-center font-sans">

      <img id="weather-icon" class="mx-auto w-16 h-16 mb-2" src="" alt="Icono del clima">

      <div id="weather-main" class="text-lg font-bold mb-1">Soleado</div>

      <div id="weather-temp" class="text-3xl font-extrabold mb-2">25°C</div>

      <div id="weather-minmax" class="flex justify-between text-sm">
        <span id="weather-min">Min: 18°C</span>
        <span id="weather-max">Max: 28°C</span>
      </div>
    </div>


    <div class="bg-white bg-opacity-80 p-8 rounded-2xl shadow-lg max-w text-center">
      <div class="text-4xl font-bold mb-6 p-8">
        <h1 class="mb-6">Ready to smile?</h1>
        <h3 id="output_joke" class="text-lg mb-6"></h3>
        <div class="flex items-center justify-center gap-4 m-8 bg-red" id="ratingDiv">
          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="happyIcon" data-value="3"><img class="w-full h-full object-cover pointer-events-none"
              src="/image/happyIcon.svg" alt=""></div>

          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="neutralIcon" data-value="2"><img class="w-full h-full object-cover pointer-events-none"
              src="/image/neutralIcon.svg" alt=""></div>

          <div
            class="iconImage h-12 w-12 rounded-full overflow-hidden inline-flex items-center justify-center cursor-pointer"
            id="angryIcon" data-value="1"><img class="w-full h-full object-cover pointer-events-none"
              src="/image/angryIcon.svg" alt=""></div>
        </div>
        <button type="submit" id="next_joke"
          class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-800 transition">Next Joke</button>
      </div>

    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
